[project]
name = "hirz"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hirz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hirz --cov-report=term-missing --cov-fail-under=80"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]
