---
autonomy:
  communication:
    contact_emergency_services:
      mode: ask
      quorum: any_adult
    contact_trusted_contact:
      mode: auto
    notify_member:
      mode: auto
  energy:
    appliance_start:
      conditions:
      - context.hour >= 7 and context.hour < 22
      mode: auto
      overrides:
      - mode: ask
        when: context.hour >= 22 or context.hour < 7
    battery_dispatch:
      mode: auto
    ev_charge:
      conditions:
      - asset.policy.needed_by is set
      mode: auto
    hvac_adjust:
      bounds:
        max_f: 76
        min_f: 66
      conditions:
      - not occupancy.sleeping_in(action.target.zone)
      mode: auto
      overrides:
      - mode: ask
        when: occupancy.sleeping_in(action.target.zone)
    optimize_cost:
      bounds:
        ev_soc_floor: 0.3
      budget:
        usd_per_day: 10
      mode: auto
  environment:
    comfort_profile:
      mode: auto
    lights:
      mode: auto
    shades:
      mode: auto
  finance:
    change_payee:
      mode: never
    transfer_money:
      mode: never
    verify_request:
      mode: auto
  health:
    comfort_preferences:
      mode: auto
    medical_decisions:
      mode: never
    routine_reminders:
      mode: auto
  security:
    access_code_share:
      ask_channels: [app_push]
      mode: never
    arm_disarm:
      ask_channels:
      - app_push
      mode: ask
    camera_disable:
      ask_channels:
      - app_push
      max_minutes: 120
      mode: ask
      quorum: owner
    door_unlock:
      allowed_requesters:
      - owner
      - adult
      ask_channels:
      - app_push
      max_open_minutes: 10
      mode: ask
      quorum: any_adult
defaults:
  approval_ttl_minutes: 30
  ask_channels:
  - alexa
  - app_push
  unlisted_class: ask
household: quinn-home
learning:
  accept_memory_proposals: manual
per_role:
  child:
    '*':
      mode: never
  guest:
    '*':
      mode: never
    environment.lights:
      mode: auto
  teen:
    energy.hvac_adjust:
      mode: ask
    security.door_unlock:
      mode: never
  unknown:
    '*':
      mode: never
quiet_hours:
- affects:
  - appliance_start
  - lights
  days:
  - mon
  - tue
  - wed
  - thu
  - sun
  from: '22:30'
  to: 06:30
roles:
  adult: {}
  caregiver:
    inherits: adult
    limited_to:
    - environment
    - health
    - communication
  child: {}
  guest: {}
  owner:
    inherits: adult
  teen: {}
  unknown: {}
verification:
  require_requester_confirmation:
  - security.door_unlock
  - security.camera_disable
  trusted_contact_methods_order:
  - app_confirmation
  - verified_callback
  - safe_word
  - verified_email
version: 7
